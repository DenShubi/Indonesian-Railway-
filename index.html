<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Indonesian Railway Visualizer — Java Commuter Lines</title>
  <meta name="description" content="A 3D map of commuter trains across Java, animated from the published timetables." />
  <meta name="theme-color" content="#9c3a35" />
  <link rel="preconnect" href="https://tiles.openfreemap.org" crossorigin />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" />
</head>
<body>
  <!-- The shell is the front of a train: the destination board across the top with
       the line name centred on it, the windscreen in the middle, and the apron below
       carrying the controls between two headlights. -->
  <div id="cab">
    <header id="board">
      <p class="hud-note">*scheduled positions, not live GPS</p>

      <!-- Destination board: the line name sits centre-top, the way a headboard
           carries the name of the service. -->
      <div class="board-plate">
        <span class="hud-title">Java Commuter Lines</span>
      </div>

      <div class="board-clock">
        <span id="clock">--:--:--</span>
        <span id="train-count" class="hud-count">0 trains</span>
      </div>
    </header>

    <main id="screen">
      <div id="map"></div>

      <!-- Time of day over the map: deep blue through the night, a little warmth at
           dawn and dusk, nothing at all in the middle of the day. -->
      <div id="nightfall" class="nightfall" aria-hidden="true"></div>

      <aside id="lines" class="panel" aria-label="Lines"></aside>
      <section id="detail" class="panel hidden" aria-label="Details"></section>
      <div id="tooltip" class="tooltip" hidden aria-hidden="true"></div>
      <div id="loading" class="loading">Loading timetable&hellip;</div>

      <button id="cab-restore" class="cab-restore" type="button" hidden
              aria-label="Show the cab again">&#x2715;</button>
    </main>

    <div id="apron">
      <button id="lamp-lines" class="lamp" type="button" aria-pressed="true">
        <span class="lamp-glass"></span>
        <span class="lamp-label">Lines</span>
      </button>

      <div class="desk">
        <div class="desk-row">
          <button id="play" class="btn" type="button" aria-label="Pause">Pause</button>
          <div class="speeds" id="speeds" role="group" aria-label="Playback speed"></div>
          <button id="now" class="btn" type="button">Now</button>
        </div>
        <input id="scrub" class="scrub" type="range" min="0" max="86400" step="30" value="0"
               aria-label="Time of day" />
      </div>

      <button id="lamp-full" class="lamp" type="button" aria-pressed="false">
        <span class="lamp-glass"></span>
        <span class="lamp-label">Map</span>
      </button>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
