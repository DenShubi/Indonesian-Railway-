<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Indonesian Railway Visualizer — Surabaya Commuter Line</title>
  <meta name="description" content="A 3D map of KAI Commuter Wilayah 8 (Surabaya) trains, animated from the published timetable." />
  <link rel="preconnect" href="https://tiles.openfreemap.org" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" />
</head>
<body>
  <div id="map"></div>

  <header id="hud" class="panel">
    <div class="hud-brand">
      <span class="hud-title">Surabaya Commuter Line</span>
      <span class="hud-sub">KAI Commuter Wilayah 8 &middot; scheduled positions, not live GPS</span>
    </div>
    <div class="hud-clock">
      <span id="clock">--:--:--</span>
      <span id="train-count" class="hud-count">0 trains</span>
    </div>
    <div class="hud-controls">
      <button id="play" class="btn" type="button" aria-label="Pause">Pause</button>
      <div class="speeds" id="speeds" role="group" aria-label="Playback speed"></div>
      <button id="now" class="btn" type="button">Now</button>
    </div>
    <input id="scrub" class="scrub" type="range" min="0" max="86400" step="30" value="0" aria-label="Time of day" />
  </header>

  <aside id="lines" class="panel" aria-label="Lines"></aside>
  <section id="detail" class="panel hidden" aria-label="Details"></section>

  <div id="loading" class="loading">Loading timetable&hellip;</div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
